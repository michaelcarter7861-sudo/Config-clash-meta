name: Update Japan Clash Meta Config

on:
  schedule:
    - cron: '0 0 * * *' # Rozana ek baar chalega (UTC time ke mutabiq)
  workflow_dispatch: # Manual run karne ka option

jobs:
  build-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run Config Generator Script
        env:
          PROXY_SUB_URL: ${{ secrets.PROXY_SUB_URL }} # Agar koi secret subscription URL ho
        run: |
          python generate_config.py

      - name: Commit and Push if Yaml Changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add clash-meta-config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Japan Clash Meta config [skip ci]" && git push)
