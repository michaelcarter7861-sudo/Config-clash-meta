port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: Japan-Node-Fallback
  type: ss
  server: 1.1.1.1
  port: 443
  cipher: aes-128-gcm
  password: password
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Japan-Auto
- name: Japan-Auto
  type: url-test
  proxies:
  - Japan-Node-Fallback
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- DOMAIN-SUFFIX,co.jp,Proxy
- GEOIP,JP,Proxy
- MATCH,Proxy
