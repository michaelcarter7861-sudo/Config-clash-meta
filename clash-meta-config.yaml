port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: Japan-Node-Free
  type: vless
  server: japan.example.com
  port: 443
  uuid: your-uuid-here
  network: ws
  tls: true
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Japan-Auto
- name: Japan-Auto
  type: url-test
  proxies:
  - Japan-Node-Free
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- DOMAIN-SUFFIX,co.jp,Proxy
- GEOIP,JP,Proxy
- MATCH,Proxy
