port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxy-providers:
  Japan-Free-Pool-1:
    type: http
    url: "https://raw.githubusercontent.com/aiboboxx/clashfree/main/clash.yml"
    interval: 3600
    path: ./jp_pool1.yaml
    filter: "(?i)jp|japan|🇯🇵|日本|tokyo|osaka"
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

  Japan-Free-Pool-2:
    type: http
    url: "https://raw.githubusercontent.com/ripaojiedian/freenode/main/clash"
    interval: 3600
    path: ./jp_pool2.yaml
    filter: "(?i)jp|japan|🇯🇵|日本|tokyo|osaka"
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Japan-Auto
      - DIRECT
    use:
      - Japan-Free-Pool-1
      - Japan-Free-Pool-2

  - name: Japan-Auto
    type: url-test
    use:
      - Japan-Free-Pool-1
      - Japan-Free-Pool-2
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100

rules:
  - DOMAIN-SUFFIX,co.jp,Proxy
  - GEOIP,JP,Proxy
  - MATCH,Proxy
